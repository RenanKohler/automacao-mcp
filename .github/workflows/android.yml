name: App Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compila o APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Publica na release "android"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk automacao-celular.apk
          gh release delete android --yes --cleanup-tag || true
          gh release create android automacao-celular.apk \
            --target "${{ github.sha }}" \
            --title "App Android (compilação ${{ github.run_number }})" \
            --notes "Baixe automacao-celular.apk no celular, instale, ligue o serviço Automação em Acessibilidade e cole a URL do conector no app."
